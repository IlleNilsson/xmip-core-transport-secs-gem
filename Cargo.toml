[package]
name = "xmip-core-transport-secs-gem"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-transport-secs-gem"
description = "SECS/GEM transport: HSMS over TCP with select, linktest and separate, SECS-II items encoded and decoded, each data message a Stream addressed by stream and function — the semiconductor equipment interface. A xmip-core-transport technology."
publish.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
# A Technology depends on its parent Capability, never the reverse
# (repository-model.md). The estate's libraries otherwise: HSMS is a length
# prefix and a ten-byte header over TCP, and SECS-II is a format byte and a
# length. Its declaration takes the capability's `timeout`
# (`transport::configured::timeout`).
transport = { workspace = true }
# The most a connection is read for: the ceiling an HSMS length is held to
# (`net::MAX_BODY`); E37 states none of its own.
net = { workspace = true, optional = true }
# The estate's encoding primitives: the one depth a nested list is read to
# (`codec::depth`).
codec = { workspace = true, optional = true }
# The settings this technology declares (xcore::settings), read through
# transport::Configured (ADR-0064, amendment 2026-09-26).
xcore = { workspace = true }

[features]
# The code and its declaration: the transport guide's "The declaration",
# module/core/capability/transport/doc/adding-a-transport.md.
default = ["declaration", "dep:net", "dep:codec"]
# The declaration alone, with the session id a select is made under unless a
# Location says.
declaration = []

[dev-dependencies]
# The loopback payloads the tests drive, from the capability's test
# support and never a production build (ADR-0044).
transport = { workspace = true, features = ["test-support"] }
# A loopback address no one holds, for what a test wants nothing listening
# at or binds later (`net::fixture::unheld`).
net = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
